<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var path = location.pathname;
      var repo = "/bible-verse-404-/";
      var at = path.indexOf(repo);
      var baseHref = null;
      if (at !== -1) {
        baseHref = path.slice(0, at) + repo;
      } else if (!/^\/(?:index\.html|404\.html)?$/.test(path)) {
        baseHref = "/";
      }
      if (baseHref) {
        var base = document.createElement("base");
        base.href = baseHref;
        document.head.appendChild(base);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到這一頁</title>
  <meta name="description" content="安靜的 404 頁。每次讀一句新標點和合本與英王欽定本經文，配上一張相應的風景。">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Serif+TC:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <figure class="photo" id="photo">
      <img id="verse-image" alt="" referrerpolicy="no-referrer" decoding="async">
      <figcaption class="photo-credit"><a href="https://unsplash.com" rel="noreferrer">Unsplash</a></figcaption>
    </figure>
    <section class="verse-panel">
      <div class="verse-copy">
        <h1 class="kicker">404<span class="kicker-sep">·</span>找不到這一頁</h1>
        <div id="verse-live" aria-live="polite">
          <blockquote>
            <p class="verse-zh" id="verse-zh"></p>
            <p class="verse-en" id="verse-en" lang="en"></p>
          </blockquote>
          <p class="citation" id="verse-cite"></p>
        </div>
        <div class="actions">
          <button type="button" class="next" id="next-verse">換一句</button>
        </div>
        <p class="colophon">新標點和合本 · King James Version</p>
        <noscript><p class="noscript">請啟用 JavaScript，才能讀到這一句。</p></noscript>
      </div>
    </section>
  </main>
  <script src="js/verses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
